name: Release

# Changesets release flow: on push to main, open/update a "Version Packages" PR
# that bumps versions + updates changelogs from the accumulated changesets.
# (Publishing to a registry is intentionally left unconfigured until the project
# decides where/whether to publish.)

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create Version Packages PR
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
