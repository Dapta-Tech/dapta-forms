name: CI/CD Pipeline

# Build once, deploy anywhere:
#   develop -> build forms-api + forms-web, push ECR, bump Flux dev/lab/*
#   main    -> no rebuild; promote the SAME images from Flux dev/ to prd/
#
# NEXT_PUBLIC_* note: server-side code reads API_URL from the per-env ConfigMap
# at runtime (apps/web/lib/api-url.ts), so one web image serves both envs. The
# build-args below only bake brand/platform values, identical in dev and prd.
# The baked NEXT_PUBLIC_API_URL is just the client-bundle fallback.

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 344000029672.dkr.ecr.us-east-2.amazonaws.com
  NAMESPACE: lab
  MANIFESTS_REPO_OWNER: Dapta-Tech
  MANIFESTS_REPO: apps-configs-flux2
  WORKFLOW_TRACKER_API_URL: "https://workflow-tracker-api.dapta.dev"

jobs:
  # -------------------------------------------------------------------------
  # develop only: build both images once and push to ECR
  # -------------------------------------------------------------------------
  build-and-push:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
      start_time: ${{ steps.set_start_time.outputs.start_time }}

    steps:
    - name: Set start time
      id: set_start_time
      run: |
        START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        echo "start_time=${START_TIME}" >> $GITHUB_OUTPUT
        echo "Workflow started at: ${START_TIME}"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_ECR }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_ECR }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Create ECR repositories if not exist
      run: |
        for repo in forms-api forms-web; do
          if ! aws ecr describe-repositories --repository-names "$repo" --region "$AWS_REGION" 2>/dev/null; then
            echo "Creating ECR repository ${repo}"
            aws ecr create-repository \
              --repository-name "$repo" \
              --image-tag-mutability MUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --region "$AWS_REGION"
          else
            echo "ECR repository ${repo} already exists"
          fi
        done

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Generate image tag (short-sha + YYYYMMDD-HHMM)
      id: set_tag
      run: |
        IMAGE_TAG="${GITHUB_SHA::7}-$(date +'%Y%m%d-%H%M')"
        echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
        echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
        echo "Tag de la imagen: ${IMAGE_TAG}"

    - name: Build + push forms-api
      run: |
        IMG="${ECR_REGISTRY}/forms-api:${IMAGE_TAG}"
        docker build --platform linux/amd64 -f apps/api/Dockerfile -t "$IMG" .
        docker push "$IMG"

    - name: Build + push forms-web
      run: |
        IMG="${ECR_REGISTRY}/forms-web:${IMAGE_TAG}"
        # Single build for BOTH envs. API_URL comes from the per-env ConfigMap
        # at runtime; these args only bake brand/platform + a client fallback.
        docker build --platform linux/amd64 -f apps/web/Dockerfile \
          --build-arg NEXT_PUBLIC_API_URL="https://forms-api.dapta.dev" \
          --build-arg NEXT_PUBLIC_PRODUCT_NAME="Dapta Forms" \
          --build-arg NEXT_PUBLIC_PLATFORM_URL="https://app.dapta.ai" \
          --build-arg NEXT_PUBLIC_LANDING_URL="https://dapta.ai/forms/" \
          -t "$IMG" .
        docker push "$IMG"

  # -------------------------------------------------------------------------
  # develop only: point Flux dev manifests at the images just built
  # -------------------------------------------------------------------------
  deploy-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest

    steps:
    - name: Generate GitHub App Token
      id: generate-token
      uses: tibdex/github-app-token@v2
      with:
        app_id: ${{ secrets.GITOPS_APP_ID }}
        private_key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        repository: Dapta-Tech/apps-configs-flux2

    - name: Checkout apps-configs-flux2 repo
      uses: actions/checkout@v4
      with:
        repository: ${{ env.MANIFESTS_REPO_OWNER }}/${{ env.MANIFESTS_REPO }}
        ref: main
        token: ${{ steps.generate-token.outputs.token }}
        path: manifests

    - name: Update dev image tags
      run: |
        cd manifests
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        for app in forms-api forms-web; do
          f="dev/${{ env.NAMESPACE }}/${app}/deployment.yaml"
          if [ ! -f "$f" ]; then
            echo "::error::$f not on flux2 main"
            exit 1
          fi
          # Bump app container and forms-api db-migrate initContainer together.
          sed -i "s|image: .*/${app}:.*|image: ${{ env.ECR_REGISTRY }}/${app}:${{ needs.build-and-push.outputs.image_tag }}|g" "$f"
          git add "$f"
          echo "Updated $f -> ${{ env.ECR_REGISTRY }}/${app}:${{ needs.build-and-push.outputs.image_tag }}"
        done

        git commit -m "Update forms images to ${{ needs.build-and-push.outputs.image_tag }} in dev" \
          || echo "No changes to commit"
        git pull --rebase origin main
        git push origin main

  # -------------------------------------------------------------------------
  # main only: promote the SAME images from Flux dev/ to prd/ (no rebuild)
  # -------------------------------------------------------------------------
  deploy-prd:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.sync_prd.outputs.image_tag }}
      start_time: ${{ steps.set_start_time.outputs.start_time }}

    steps:
    - name: Set start time
      id: set_start_time
      run: |
        START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        echo "start_time=${START_TIME}" >> $GITHUB_OUTPUT
        echo "Workflow started at: ${START_TIME}"

    - name: Generate GitHub App Token
      id: generate-token
      uses: tibdex/github-app-token@v2
      with:
        app_id: ${{ secrets.GITOPS_APP_ID }}
        private_key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        repository: Dapta-Tech/apps-configs-flux2

    - name: Checkout apps-configs-flux2 repo
      uses: actions/checkout@v4
      with:
        repository: ${{ env.MANIFESTS_REPO_OWNER }}/${{ env.MANIFESTS_REPO }}
        ref: main
        token: ${{ steps.generate-token.outputs.token }}
        path: manifests

    - name: Promote images from dev to prd
      id: sync_prd
      run: |
        cd manifests
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        PROMOTED_TAG=""
        for app in forms-api forms-web; do
          SRC="dev/${{ env.NAMESPACE }}/${app}/deployment.yaml"
          DST="prd/${{ env.NAMESPACE }}/${app}/deployment.yaml"
          if [ ! -f "$SRC" ] || [ ! -f "$DST" ]; then
            echo "::error::Missing $SRC or $DST"
            exit 1
          fi

          IMAGE_URI=$(grep -m1 '^[[:space:]]*image:' "$SRC" | awk '{print $2}')
          if [ -z "$IMAGE_URI" ]; then
            echo "::error::No se pudo leer image: en $SRC"
            exit 1
          fi

          TAG="${IMAGE_URI##*:}"
          PROMOTED_TAG="$TAG"
          echo "Promoting ${IMAGE_URI} (tag ${TAG}) from dev -> prd"

          sed -i "s|image: .*/${app}:.*|image: ${IMAGE_URI}|g" "$DST"
          git add "$DST"
        done

        echo "image_tag=${PROMOTED_TAG}" >> $GITHUB_OUTPUT

        git commit -m "Promote forms images ${PROMOTED_TAG} from dev to prd" \
          || echo "No changes to commit"
        git pull --rebase origin main
        git push origin main

  # -------------------------------------------------------------------------
  # Always track workflow execution (dev build/deploy or prd promote)
  # -------------------------------------------------------------------------
  track-workflow:
    needs: [build-and-push, deploy-dev, deploy-prd]
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
    - name: Calculate workflow duration and send tracking data
      run: |
        REF="${{ github.ref }}"

        if [ "$REF" = "refs/heads/develop" ]; then
          START_TIME="${{ needs.build-and-push.outputs.start_time }}"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          if [ "${{ needs.build-and-push.result }}" = "success" ] && [ "${{ needs.deploy-dev.result }}" = "success" ]; then
            WORKFLOW_STATUS="success"
          else
            WORKFLOW_STATUS="failure"
          fi
        else
          START_TIME="${{ needs.deploy-prd.outputs.start_time }}"
          IMAGE_TAG="${{ needs.deploy-prd.outputs.image_tag }}"
          if [ "${{ needs.deploy-prd.result }}" = "success" ]; then
            WORKFLOW_STATUS="success"
          else
            WORKFLOW_STATUS="failure"
          fi
        fi

        END_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        START_EPOCH=$(date -d "$START_TIME" +%s 2>/dev/null || echo 0)
        END_EPOCH=$(date -d "$END_TIME" +%s 2>/dev/null || date +%s)
        DURATION=$((END_EPOCH - START_EPOCH))

        if [ -z "$IMAGE_TAG" ]; then
          IMAGE_TAG="no-image"
        fi

        echo "📊 dapta-forms workflow tracking:"
        echo "Repository: ${{ github.repository }}"
        echo "Ref: $REF"
        echo "Start Time: $START_TIME"
        echo "End Time: $END_TIME"
        echo "Duration: ${DURATION} seconds"
        echo "Status: $WORKFLOW_STATUS"
        echo "Image Tag: $IMAGE_TAG"

        PAYLOAD=$(cat <<EOF
        {
          "repository_name": "${{ github.repository }}",
          "execution_datetime": "$END_TIME",
          "duration_seconds": $DURATION,
          "status": "$WORKFLOW_STATUS",
          "image_tag": "$IMAGE_TAG"
        }
        EOF
        )

        echo "📤 Sending workflow tracking data to API..."
        for i in {1..3}; do
          if curl -X POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-DaptaForms-Tracker" \
            -d "$PAYLOAD" \
            "$WORKFLOW_TRACKER_API_URL/workflow-execution" \
            --max-time 30 \
            --retry 2 \
            --fail-with-body; then
            echo "✅ Workflow tracking sent successfully on attempt $i"
            break
          else
            echo "❌ Failed to send workflow tracking data (attempt $i/3)"
            if [ $i -eq 3 ]; then
              echo "⚠️  All attempts failed. Tracking data not sent."
              exit 0
            fi
            sleep 5
          fi
        done
