name: CI

# Public, generic CI — nothing Dapta-internal. A contributor's fork runs this
# green with zero secrets. Internal deployment lives in the private deploy/
# overlay, never here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Typecheck · Test (SQLite) · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  postgres:
    name: Test on Postgres (source of truth — submission integrity)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quill
          POSTGRES_PASSWORD: quill
          POSTGRES_DB: quill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quill"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://quill:quill@localhost:5432/quill
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Migrate + seed on Postgres
        run: pnpm db:migrate && pnpm db:seed
      - name: Submission integrity on real Postgres (unique-per-session upsert)
        # submission.spec.ts runs against DATABASE_URL: it upserts one submission
        # per (form, session), and directly asserts the submission_form_session_uq
        # unique index rejects a duplicate insert. Same test, both dialects —
        # that is the SQLite↔Postgres parity guarantee for Forms.
        run: pnpm --filter @quill/db test
        env:
          DATABASE_URL: postgres://quill:quill@localhost:5432/quill

  publish-gate:
    name: Publish gate (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install scanners
        # No `|| true`: a failed scanner install must fail the job, never let the
        # gate pass on the grep layer alone (H4). The gate itself also FAILs if a
        # scanner is missing at run time.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gitleaks: install from the release binary — the old raw install.sh path
          # 404s. Resolve the latest tag, then extract the linux/x64 binary.
          GL_TAG=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -oE '"tag_name": *"v[0-9.]+"' | grep -oE 'v[0-9.]+' | head -1)
          GL_VER=${GL_TAG#v}
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GL_TAG}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          # trufflehog: official installer.
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
      - name: Verify scanners are installed
        run: |
          command -v gitleaks
          command -v trufflehog
          gitleaks version
      - name: Run publish gate
        run: bash scripts/publish-gate.sh
